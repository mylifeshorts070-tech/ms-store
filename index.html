
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS STORE | Shopping</title>
<style>
:root{--navy:#111827;--orange:#f59e0b;--bg:#f5f6fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#202536}
header{background:var(--navy);color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:bold}.logo span{color:var(--orange)}
button,a{cursor:pointer}
header a{color:var(--navy);background:var(--orange);padding:10px 13px;border-radius:8px;text-decoration:none;font-weight:bold}
.account{background:white;color:var(--navy)!important}
.notice{background:#fff1f2;color:#dc2626;padding:8px;overflow:hidden;white-space:nowrap;font-size:13px}
.notice span{display:inline-block;padding-right:55px;animation:move 22s linear infinite}
@keyframes move{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.hero{text-align:center;padding:45px 15px;background:linear-gradient(120deg,#111827,#334155);color:white}
.hero h1{font-size:clamp(28px,6vw,42px)}
.hero p{color:#e5e7eb}
main{padding:18px 5%}
input{width:100%;padding:13px;border:1px solid #d5dbe5;border-radius:9px;font-size:16px}
h2{font-size:21px}
.category-list{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}
.category-list button{border:1px solid #ddd;background:white;border-radius:22px;padding:9px 15px;white-space:nowrap}
.category-list button.active{background:var(--navy);color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 15px #00000012;min-width:0}
.photo{height:190px;background:#e9edf3;display:grid;place-items:center;font-size:40px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:14px}
.info h3{font-size:18px;line-height:1.4;margin:0 0 10px;color:#111827;overflow-wrap:anywhere}
.price{display:block;width:100%;font-size:23px;line-height:1.3;font-weight:900;color:#b45309;background:#fff7e6;padding:9px 11px;border-radius:8px;margin:0 0 11px;overflow-wrap:anywhere}
.stock{font-size:14px;color:#475569;margin-bottom:12px;font-weight:600}
.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.add,.buy{width:100%;min-width:0;padding:12px 5px;border:0;border-radius:9px;font-weight:bold;font-size:13px;line-height:1.3}
.add{background:var(--navy);color:white}
.buy{background:var(--orange);color:#111827}
.add:disabled,.buy:disabled{background:#aaa;color:white;cursor:not-allowed}
.empty{background:white;padding:22px;text-align:center;border-radius:10px;grid-column:1/-1;color:#64748b}
.cart{margin-top:25px;background:white;padding:18px;border-radius:12px}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.qty{display:flex;align-items:center;gap:8px;white-space:nowrap}
.qty button{border:0;padding:7px 11px;border-radius:6px;background:#e5e7eb;font-size:17px}
.qty button:disabled{opacity:.4;cursor:not-allowed}
.total{display:flex;justify-content:space-between;font-weight:bold;margin:15px 0}
.checkout{display:block;text-align:center;background:var(--orange);color:#111827;text-decoration:none;padding:14px;border-radius:9px;font-weight:bold}
.cart-warning{color:#dc2626;font-size:13px;margin-top:10px;line-height:1.5}
footer{text-align:center;background:var(--navy);color:white;padding:25px;margin-top:30px}
@media(min-width:650px){
 .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
 .photo{height:230px}
 .info{padding:16px}
 .info h3{font-size:19px}
 .price{font-size:25px}
 .add,.buy{font-size:14px;padding:13px 7px}
}
</style>
</head>
<body>

<header>
 <div class="logo">MS <span>STORE</span></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
  <a class="account" href="my-account.html">My Account</a>
  <a href="#cart">🛒 Cart (<span id="cartCount">0</span>)</a>
 </div>
</header>

<div class="notice"><span id="noticeText">Welcome to MS STORE</span></div>

<section class="hero">
 <h1>Welcome to MS STORE</h1>
 <p>আপনার পছন্দের পণ্য কিনুন সহজে ও নিশ্চিন্তে।</p>
</section>

<main>
 <input id="search" type="search" placeholder="পণ্য খুঁজুন...">

 <h2>Categories</h2>
 <div class="category-list" id="categories"></div>

 <h2>Our Products</h2>
 <div class="grid" id="products">
  <div class="empty">পণ্য লোড হচ্ছে...</div>
 </div>

 <section class="cart" id="cart">
  <h2>🛒 Your Cart</h2>
  <div id="cartItems">আপনার Cart খালি।</div>
  <div id="cartWarning" class="cart-warning"></div>
  <div class="total"><span>Subtotal</span><span id="subtotal">৳0</span></div>
  <a class="checkout" href="checkout.html">PROCEED TO CHECKOUT</a>
 </section>
</main>

<footer>
 <h2>MS STORE</h2>
 <p>Your Trusted Online Shopping Store</p>
 <small>© 2026 MS STORE</small>
</footer>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
  authDomain: "ms-store-admin-26416.firebaseapp.com",
  projectId: "ms-store-admin-26416",
  storageBucket: "ms-store-admin-26416.firebasestorage.app",
  messagingSenderId: "968008425065",
  appId: "1:968008425065:web:1e0904dcab96d4d003ccf8"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let products=[],category='All',cart={};

// Buy Now থেকে ফিরে এলে আগের Cart পুনরুদ্ধার
try{
 if(localStorage.getItem('msBuyNowMode')==='1'){
  const backup=localStorage.getItem('msCartBackup');
  if(backup!==null){
   localStorage.setItem('msCart',backup);
  }
  localStorage.removeItem('msCartBackup');
  localStorage.removeItem('msBuyNowMode');
 }
 cart=JSON.parse(localStorage.getItem('msCart')||'{}');
 if(!cart||typeof cart!=='object'||Array.isArray(cart))cart={};
}catch(e){cart={};}

function saveCart(){
 localStorage.setItem('msCart',JSON.stringify(cart));
 renderCart();
 renderProducts();
}

// BUY NOW: শুধু নির্বাচিত পণ্য Checkout-এ পাঠাবে
function buyNow(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;

 const stock=Math.max(0,Number(p.stock)||0);
 if(stock<1){
  alert('দুঃখিত! এই পণ্যটি স্টকে নেই।');
  return;
 }

 try{
  // আগের Cart সাময়িকভাবে সংরক্ষণ
  localStorage.setItem('msCartBackup',localStorage.getItem('msCart')||'{}');

  // নির্বাচিত পণ্যটিই Checkout Cart হবে
  const directCart={[id]:1};
  localStorage.setItem('msCart',JSON.stringify(directCart));
  localStorage.setItem('msBuyNowMode','1');

  location.href='checkout.html';
 }catch(error){
  alert('Checkout চালু করা যাচ্ছে না। আবার চেষ্টা করুন।');
 }
}

function loadProducts(){
 onSnapshot(collection(db,'storeProducts'),s=>{
  products=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);
  renderCategories();
  renderProducts();
  renderCart();
 },e=>{
  console.error(e);
  $('products').innerHTML='<div class="empty">পণ্য লোড হয়নি। Firebase Rules পরীক্ষা করুন।</div>';
 });
}

function renderCategories(){
 const cats=['All',...new Set(products.map(p=>p.category||'General'))];
 if(!cats.includes(category))category='All';

 $('categories').innerHTML=cats.map(c=>
  `<button class="${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`
 ).join('');

 $('categories').querySelectorAll('[data-cat]').forEach(b=>{
  b.onclick=()=>{
   category=b.dataset.cat;
   renderCategories();
   renderProducts();
  };
 });
}

function renderProducts(){
 const q=$('search').value.trim().toLowerCase();

 const list=products.filter(p=>
  (category==='All'||(p.category||'General')===category)&&
  String(p.name||'').toLowerCase().includes(q)
 );

 $('products').innerHTML=list.length?list.map(p=>{
  const stock=Math.max(0,Number(p.stock)||0);
  const inCart=Number(cart[p.id]||0);
  const available=stock-inCart;

  return `
  <article class="card">
   <div class="photo">
    ${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="${esc(p.name)}">`:'🛍️'}
   </div>

   <div class="info">
    <h3>${esc(p.name||'Product')}</h3>

    <div class="price">${money(p.price)}</div>

    <div class="stock">
     ${stock<=0?'স্টক শেষ':'স্টক: '+stock}
    </div>

    <div class="product-actions">
     <button class="add" data-add="${esc(p.id)}"
      ${available<=0?'disabled':''}>
      ${stock<=0?'OUT OF STOCK':available<=0?'CART LIMIT':'ADD TO CART'}
     </button>

     <button class="buy" data-buy="${esc(p.id)}"
      ${stock<=0?'disabled':''}>
      ${stock<=0?'OUT OF STOCK':'BUY NOW'}
     </button>
    </div>
   </div>
  </article>`;
 }).join(''):'<div class="empty">কোনো পণ্য পাওয়া যায়নি।</div>';

 $('products').querySelectorAll('[data-add]').forEach(b=>{
  b.onclick=()=>{
   const p=products.find(x=>x.id===b.dataset.add);
   if(!p)return;

   const stock=Math.max(0,Number(p.stock)||0);
   const count=Number(cart[p.id]||0);

   if(count>=stock){
    alert('স্টকে পর্যাপ্ত পণ্য নেই।');
    return;
   }

   cart[p.id]=count+1;
   saveCart();
  };
 });

 $('products').querySelectorAll('[data-buy]').forEach(b=>{
  b.onclick=()=>buyNow(b.dataset.buy);
 });
}

function renderCart(){
 const entries=Object.entries(cart).filter(([id,q])=>
  products.some(p=>p.id===id)&&Number(q)>0
 );

 cart=Object.fromEntries(entries);
 localStorage.setItem('msCart',JSON.stringify(cart));

 $('cartCount').textContent=entries.reduce((s,[,q])=>s+Number(q),0);

 let sum=0,warning=false;

 $('cartItems').innerHTML=entries.length?entries.map(([id,q])=>{
  const p=products.find(x=>x.id===id);
  if(!p)return '';

  const stock=Math.max(0,Number(p.stock)||0);
  const qty=Number(q);
  sum+=Number(p.price||0)*qty;

  if(qty>stock)warning=true;

  return `
  <div class="cart-row">
   <span>
    <b>${esc(p.name)}</b><br>
    ${money(p.price)} × ${qty}
    ${qty>stock?'<br><small style="color:#dc2626">স্টকের চেয়ে বেশি পরিমাণ Cart-এ আছে</small>':''}
   </span>

   <span class="qty">
    <button data-id="${esc(id)}" data-change="-1">−</button>
    ${qty}
    <button data-id="${esc(id)}" data-change="1" ${qty>=stock?'disabled':''}>+</button>
   </span>
  </div>`;
 }).join(''):'আপনার Cart খালি।';

 $('cartWarning').textContent=warning?
  'আপনার Cart-এর কিছু পণ্যের পরিমাণ বর্তমানে থাকা স্টকের চেয়ে বেশি। Checkout করার আগে পরিমাণ ঠিক করুন।':'';

 $('subtotal').textContent=money(sum);

 $('cartItems').querySelectorAll('[data-id]').forEach(b=>{
  b.onclick=()=>{
   const id=b.dataset.id;
   const p=products.find(x=>x.id===id);
   if(!p)return;

   const n=Number(cart[id]||0)+Number(b.dataset.change);
   const stock=Math.max(0,Number(p.stock)||0);

   if(n<=0)delete cart[id];
   else if(n<=stock)cart[id]=n;
   else alert('স্টকে পর্যাপ্ত পণ্য নেই।');

   saveCart();
  };
 });
}

$('search').oninput=renderProducts;

onSnapshot(collection(db,'storeNotices'),s=>{
 const texts=s.docs.map(d=>d.data())
  .filter(n=>n.active&&n.text)
  .map(n=>n.text);

 $('noticeText').textContent=texts.length?
  texts.join('   •   '):
  'Welcome to MS STORE';
});

loadProducts();
</script>
</body>
</html>
