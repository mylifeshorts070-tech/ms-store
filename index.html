
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS STORE | Online Shopping</title>
<style>/* PROFESSIONAL CHECKOUT DESIGN */
#checkout {
  background: #ffffff;
  padding: 25px;
  border-radius: 20px;
  margin: 30px auto;
  max-width: 650px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.07);
}

#checkout h2 {
  font-size: 30px;
  margin-bottom: 24px;
  color: #111827;
}

#checkout input:not([type="radio"]),
#checkout textarea {
  display: block;
  width: 100%;
  padding: 16px;
  margin: 14px 0;
  border: 1.5px solid #dbe1eb;
  border-radius: 12px;
  font-size: 17px;
  background: #f9fafb;
  outline: none;
}

#checkout input:focus,
#checkout textarea:focus {
  border-color: #f59e0b;
  background: #fff;
}

#checkout textarea {
  min-height: 110px;
  resize: vertical;
}

#checkout h3 {
  font-size: 21px;
  margin: 22px 0 12px;
}

#checkout label {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: #f3f5fa;
  padding: 15px;
  margin: 5px 4px 12px 0;
  border-radius: 12px;
  font-size: 17px;
}

#checkout input[type="radio"] {
  width: 20px;
  height: 20px;
  accent-color: #f59e0b;
}

#checkoutstyon {
  display: block;
  width: 100%;
  padding: 17px;
  margin-top: 16px;
  border: none;
  border-radius: 12px;
  background: #f59e0b;
  color: #111827;
  font-size: 19px;
  font-weight: bold;
}

#checkout #orderMessage {
  font-size: 16px;
  margin-top: 15px;
}

@media(max-width:600px) {
  #checkout {
    padding: 20px;
    margin: 20px auto;
  }
  #checkout h2 {
    font-size: 26px;
  }

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#111827;color:white;padding:17px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:bold;color:#fff}
.logo span{color:#f59e0b}
header button{background:#f59e0b;color:#111;border:0;padding:11px 16px;border-radius:8px;font-weight:bold}
.hero{background:linear-gradient(120deg,#111827,#374151);color:white;padding:55px 7%;text-align:center}
.hero h1{font-size:35px;margin-bottom:12px}
.hero p{color:#ddd;margin-bottom:22px}
.hero a{background:#f59e0b;color:#111;text-decoration:none;padding:12px 25px;border-radius:7px;font-weight:bold}
.search{padding:20px 5%;display:flex;gap:10px}
.search input{width:100%;padding:14px;border:1px solid #ddd;border-radius:9px;font-size:15px}
.categories{padding:5px 5% 20px}
.categories h2,.products h2{margin-bottom:16px}
.cat-list{display:flex;gap:10px;overflow-x:auto}
.cat-list button{padding:10px 17px;border:1px solid #ddd;border-radius:20px;background:white;white-space:nowrap}
.cat-list button.active{background:#111827;color:white}
.products{padding:15px 5% 40px}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0000000c}
.product-img{height:145px;background:#e9edf3;display:flex;align-items:center;justify-content:center;font-size:55px}
.card-info{padding:12px}
.card h3{font-size:15px;margin-bottom:8px}
.price{font-weight:bold;color:#e58b00;margin-bottom:10px}
.card button{width:100%;padding:10px;background:#111827;color:white;border:0;border-radius:7px}
.cart-box{margin:15px 5% 35px;background:white;padding:18px;border-radius:12px}
.cart-box h2{margin-bottom:12px}
.cart-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.total{font-weight:bold;text-align:right;margin-top:15px}
footer{background:#111827;color:white;text-align:center;padding:28px 15px}
footer p{color:#bbb;margin-top:8px;font-size:13px}
.empty{text-align:center;color:#888;padding:15px}
@media(min-width:650px){
.product-grid{grid-template-columns:repeat(4,1fr)}
.product-img{height:190px}
.hero h1{font-size:45px}
}
</style>
</head>
<body>

<header>
<div class="logo">MS <span>STORE</span></div>
<button onclick="document.getElementById('cart').scrollIntoView()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
<h1>Welcome to MS STORE</h1>
<p>আপনার পছন্দের পণ্য কিনুন সহজেই!</p>
<a href="#products">Shop Now</a>
</section>

<div class="search">
<input type="search" id="search" placeholder="পণ্য খুঁজুন..." oninput="renderProducts()">
</div>

<section class="categories">
<h2>Categories</h2>
<div class="cat-list" id="categories"></div>
</section>

<section class="products" id="products">
<h2>Our Products</h2>
<div class="product-grid" id="productGrid"></div>
</section>

<section class="cart-box" id="cart">
<h2>🛒 Your Cart</h2>
<div id="cartItems"><div class="empty">আপনার Cart এখন খালি</div></div>
<div class="total" id="total">Total: ৳0</div>
</section>
<section class="cart-box" id="checkout">
<h2>🛍️ Checkout</h2>
<input id="customerName" placeholder="আপনার নাম">
<input id="customerPhone" type="tel" placeholder="মোবাইল নম্বর">
<textarea id="customerAddress" placeholder="সম্পূর্ণ ঠিকানা"></textarea>
<h3>Payment Method</h3>
<label><input type="radio" name="payment" value="bKash" checked> bKash</label>
<label><input type="radio" name="payment" value="COD"> Cash on Delivery</label>
<input id="bkashTrx" placeholder="bKash Transaction ID">
<button onclick="placeOrder()">Place Order</button>
<p id="orderMessage"></p>
</section>
<footer>
<h2>MS STORE</h2>
<p>Your Trusted Online Shopping Store</p>
<p>© 2026 MS STORE. All Rights Reserved.</p>
</footer>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script>
 const firebaseConfig = {
  apiKey: "AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
  authDomain: "ms-store-admin-26416.firebaseapp.com",
  projectId: "ms-store-admin-26416",
  appId: "1:968008425065:web:1e0904dcab96d4d003ccf8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const products=[
{id:1,name:"Sample T-Shirt",price:450,category:"Fashion",emoji:"👕"},
{id:2,name:"Stylish Watch",price:850,category:"Gadgets",emoji:"⌚"},
{id:3,name:"Wireless Earbuds",price:650,category:"Electronics",emoji:"🎧"},
{id:4,name:"Fashion Bag",price:550,category:"Fashion",emoji:"👜"},
{id:5,name:"Smart Bottle",price:300,category:"Lifestyle",emoji:"🧴"},
{id:6,name:"Sunglasses",price:350,category:"Fashion",emoji:"🕶️"},
{id:7,name:"Headphones",price:950,category:"Electronics",emoji:"🎧"},
{id:8,name:"Mobile Stand",price:200,category:"Gadgets",emoji:"📱"}
];

let selected="All";
let cart={};

function renderCategories(){
let cats=["All",...new Set(products.map(p=>p.category))];
document.getElementById("categories").innerHTML=cats.map(c=>
`<button class="${selected===c?'active':''}" onclick="selectCategory('${c}')">${c}</button>`
).join("");
}

function selectCategory(c){
selected=c;
renderCategories();
renderProducts();
}

function renderProducts(){
let q=document.getElementById("search").value.toLowerCase();
let list=products.filter(p=>
(selected==="All"||p.category===selected)&&p.name.toLowerCase().includes(q)
);
document.getElementById("productGrid").innerHTML=list.length?list.map(p=>`
<div class="card">
<div class="product-img">${p.emoji}</div>
<div class="card-info">
<h3>${p.name}</h3>
<div class="price">৳${p.price}</div>
<button onclick="addCart(${p.id})">Add to Cart</button>
</div>
</div>`).join(""):'<p>No products found.</p>';
}

function addCart(id){
cart[id]=(cart[id]||0)+1;
renderCart();
}

function changeQty(id,amount){
cart[id]+=amount;
if(cart[id]<=0)delete cart[id];
renderCart();
}

function renderCart(){
let ids=Object.keys(cart);
let count=ids.reduce((s,id)=>s+cart[id],0);
let total=ids.reduce((s,id)=>s+products.find(p=>p.id==id).price*cart[id],0);

document.getElementById("count").innerText=count;
document.getElementById("total").innerText="Total: ৳"+total;

document.getElementById("cartItems").innerHTML=ids.length?ids.map(id=>{
let p=products.find(x=>x.id==id);
return `<div class="cart-item">
<span>${p.name}<br>৳${p.price} × ${cart[id]}</span>
<span>
<button onclick="changeQty(${id},-1)">−</button>
${cart[id]}
<button onclick="changeQty(${id},1)">+</button>
</span>
</div>`;
}).join(""):'<div class="empty">আপনার Cart এখন খালি</div>';
}
async function placeOrder() {
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();
  const trxId = document.getElementById("bkashTrx").value.trim();
  const payment = document.querySelector('input[name="payment"]:checked').value;
  const message = document.getElementById("orderMessage");

  const ids = Object.keys(cart);
  if (!ids.length) {
    message.textContent = "আপনার Cart খালি!";
    return;
  }

  if (!name || !phone || !address) {
    message.textContent = "সব তথ্য পূরণ করুন।";
    return;
  }

  if (payment === "bKash" && !trxId) {
    message.textContent = "bKash Transaction ID দিন।";
    return;
  }

  const quantity = ids.reduce((sum, id) => sum + cart[id], 0);
  const totalPrice = ids.reduce((sum, id) => {
    const p = products.find(item => item.id == id);
    return sum + (p ? p.price * cart[id] : 0);
  }, 0);

  const productName = ids.map(id => {
    const p = products.find(item => item.id == id);
    return p ? p.name + " x " + cart[id] : "";
  }).join(", ");

  message.textContent = "অর্ডার পাঠানো হচ্ছে...";

  try {
    await db.collection("orders").add({
      customerName: name,
      phone: phone,
      address: address,
      productName: productName,
      quantity: quantity,
      totalPrice: totalPrice,
      status: "Pending",
      paymentMethod: payment,
      trxId: payment === "bKash" ? trxId : "",
      paymentStatus: payment === "bKash" ? "Unverified" : "Not applicable",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    message.textContent = "অর্ডার সফলভাবে জমা হয়েছে!";
    cart = {};
    renderCart();

  } catch (error) {
    message.textContent = "অর্ডার জমা হয়নি: " + error.message;
  }
}
renderCategories();
renderProducts();
renderCart();
</script>
</body>
</html>
