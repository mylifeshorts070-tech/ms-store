
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS STORE | Shopping</title>
<style>
:root{--navy:#111827;--orange:#f59e0b;--bg:#f5f6fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#202536}
header{background:var(--navy);color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:bold}.logo span{color:var(--orange)}
button,a{cursor:pointer}header a{color:var(--navy);background:var(--orange);padding:10px 13px;border-radius:8px;text-decoration:none;font-weight:bold}
.account{background:white;color:var(--navy)!important}
.notice{background:#fff1f2;color:#dc2626;padding:8px;overflow:hidden;white-space:nowrap;font-size:13px}
.notice span{display:inline-block;padding-right:55px;animation:move 22s linear infinite}
@keyframes move{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.hero{text-align:center;padding:45px 15px;background:linear-gradient(120deg,#111827,#334155);color:white}
.hero h1{font-size:clamp(28px,6vw,42px)}.hero p{color:#e5e7eb}
main{padding:18px 5%}
input{width:100%;padding:13px;border:1px solid #d5dbe5;border-radius:9px;font-size:16px}
h2{font-size:21px}.category-list{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}
.category-list button{border:1px solid #ddd;background:white;border-radius:22px;padding:9px 15px;white-space:nowrap}
.category-list button.active{background:var(--navy);color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0001}
.photo{height:155px;background:#e9edf3;display:grid;place-items:center;font-size:40px}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:12px}.info h3{font-size:15px;margin:0 0 8px}
.price{font-weight:bold;color:#e58b00;margin-bottom:7px}.stock{font-size:12px;color:#64748b;margin-bottom:10px}
.add{width:100%;padding:11px;border:0;border-radius:8px;background:var(--navy);color:white;font-weight:bold}
.add:disabled{background:#aaa}.empty{background:white;padding:22px;text-align:center;border-radius:10px;grid-column:1/-1;color:#64748b}
.cart{margin-top:25px;background:white;padding:18px;border-radius:12px}
.cart-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.qty button{border:0;padding:6px 10px;border-radius:6px;background:#e5e7eb}
.total{display:flex;justify-content:space-between;font-weight:bold;margin:15px 0}
.checkout{display:block;text-align:center;background:var(--orange);color:#111827;text-decoration:none;padding:14px;border-radius:9px;font-weight:bold}
footer{text-align:center;background:var(--navy);color:white;padding:25px;margin-top:30px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.photo{height:190px}}
</style>
</head>
<body>
<header>
 <div class="logo">MS <span>STORE</span></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
  <a class="account" href="my-account.html">My Account</a>
  <a href="#cart">🛒 Cart (<span id="cartCount">0</span>)</a>
 </div>
</header>
<div class="notice"><span id="noticeText">Welcome to MS STORE</span></div>
<section class="hero">
 <h1>Welcome to MS STORE</h1>
 <p>আপনার পছন্দের পণ্য কিনুন সহজে ও নিশ্চিন্তে।</p>
</section>
<main>
 <input id="search" type="search" placeholder="পণ্য খুঁজুন...">
 <h2>Categories</h2>
 <div class="category-list" id="categories"></div>
 <h2>Our Products</h2>
 <div class="grid" id="products"><div class="empty">পণ্য লোড হচ্ছে...</div></div>
 <section class="cart" id="cart">
  <h2>🛒 Your Cart</h2>
  <div id="cartItems">আপনার Cart খালি।</div>
  <div class="total"><span>Subtotal</span><span id="subtotal">৳0</span></div>
  <a class="checkout" href="checkout.html">PROCEED TO CHECKOUT</a>
 </section>
</main>
<footer><h2>MS STORE</h2><p>Your Trusted Online Shopping Store</p><small>© 2026 MS STORE</small></footer>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import{getFirestore,collection,getDocs,onSnapshot}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

const firebaseConfig={
 apiKey:"AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
 authDomain:"ms-store-admin-26416.firebaseapp.com",
 projectId:"ms-store-admin-26416",
 storageBucket:"ms-store-admin-26416.firebasestorage.app",
 messagingSenderId:"968008425065",
 appId:"1:968008425065:web:1e0904dcab96d4d003ccf8"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=[],category='All';
let cart={};
try{cart=JSON.parse(localStorage.getItem('msCart')||'{}')}catch(e){cart={}}

function saveCart(){localStorage.setItem('msCart',JSON.stringify(cart));renderCart()}
async function loadProducts(){
 try{
  const s=await getDocs(collection(db,'storeProducts'));
  products=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);
  renderCategories();renderProducts();renderCart();
 }catch(e){$('products').innerHTML='<div class="empty">পণ্য লোড হয়নি: '+esc(e.message)+'</div>'}
}
function renderCategories(){
 const cats=['All',...new Set(products.map(p=>p.category||'General'))];
 $('categories').innerHTML=cats.map(c=>`<button class="${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
 $('categories').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCategories();renderProducts()});
}
function renderProducts(){
 const q=$('search').value.trim().toLowerCase();
 const list=products.filter(p=>(category==='All'||(p.category||'General')===category)&&String(p.name||'').toLowerCase().includes(q));
 $('products').innerHTML=list.length?list.map(p=>`
 <article class="card">
  <div class="photo">${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="${esc(p.name)}">`:'🛍️'}</div>
  <div class="info"><h3>${esc(p.name)}</h3>
  <div class="price">${money(p.price)}</div>
  <div class="stock">${Number(p.stock)>0?'স্টক: '+Number(p.stock):'স্টক শেষ'}</div>
  <button class="add" data-add="${esc(p.id)}" ${Number(p.stock)<=0?'disabled':''}>ADD TO CART</button></div>
 </article>`).join(''):'<div class="empty">কোনো পণ্য পাওয়া যায়নি।</div>';
 $('products').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const p=products.find(x=>x.id===b.dataset.add);
  const count=Number(cart[p.id]||0);
  if(count>=Number(p.stock||0)){alert('স্টকে পর্যাপ্ত পণ্য নেই।');return}
  cart[p.id]=count+1;saveCart();
 });
}
function renderCart(){
 const entries=Object.entries(cart).filter(([id,q])=>products.some(p=>p.id===id)&&q>0);
 cart=Object.fromEntries(entries);
 $('cartCount').textContent=entries.reduce((s,[,q])=>s+q,0);
 let sum=0;
 $('cartItems').innerHTML=entries.length?entries.map(([id,q])=>{
  const p=products.find(x=>x.id===id);sum+=Number(p.price)*q;
  return `<div class="cart-row"><span>${esc(p.name)}<br>${money(p.price)} × ${q}</span>
  <span class="qty"><button data-id="${esc(id)}" data-change="-1">−</button> ${q} <button data-id="${esc(id)}" data-change="1">+</button></span></div>`;
 }).join(''):'আপনার Cart খালি।';
 $('subtotal').textContent=money(sum);
 $('cartItems').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.id,p=products.find(x=>x.id===id);
  const n=Number(cart[id]||0)+Number(b.dataset.change);
  if(n<=0)delete cart[id];else if(n<=Number(p.stock||0))cart[id]=n;
  else alert('স্টকে পর্যাপ্ত পণ্য নেই।');
  saveCart();
 });
}
$('search').oninput=renderProducts;
onSnapshot(collection(db,'storeNotices'),s=>{
 const texts=s.docs.map(d=>d.data()).filter(n=>n.active&&n.text).map(n=>n.text);
 $('noticeText').textContent=texts.length?texts.join('   •   '):'Welcome to MS STORE';
});
loadProducts();
</script>
</body>
</html>
