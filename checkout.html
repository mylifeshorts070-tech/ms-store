
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS STORE | Checkout</title>
<meta name="theme-color" content="#111827">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;font-family:Arial,sans-serif;color:#202536}
header{background:#111827;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
header a{color:#f59e0b;text-decoration:none;font-weight:bold}
.logo{font-size:23px;font-weight:bold}
main{max-width:750px;margin:25px auto;padding:0 14px}
.panel{background:white;border-radius:13px;padding:19px;margin-bottom:16px}
h2{margin-top:0;font-size:21px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:8px;font-size:15px;margin:5px 0 10px;background:white}
textarea{min-height:85px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.full{grid-column:1/-1}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#111827;color:white;font-size:16px;font-weight:bold;margin-top:8px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.orange{background:#f59e0b;color:#111827}
.red{background:#dc2626}
.secondary{background:#64748b}
.green{background:#15803d}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.total{font-weight:bold;font-size:18px}
.msg{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.hidden{display:none!important}
.variant-info{font-size:12px;color:#64748b;margin-top:5px}
.cart-product{padding:12px 0;border-bottom:1px solid #eee}
.cart-product strong{font-size:14px}
.cart-error{color:#dc2626;font-size:13px;margin-top:5px}
.cart-success{color:#15803d}
.payment-notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:12px;margin:8px 0 12px}
.payment-notice strong{display:block;color:#9a3412;margin-bottom:5px}
.payment-notice p{margin:0;color:#7c2d12;font-size:13px;line-height:1.6}
#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%) translateY(-120px);width:calc(100% - 30px);max-width:500px;padding:16px;border-radius:12px;background:#dcfce7;color:#166534;font-size:15px;font-weight:bold;text-align:center;box-shadow:0 5px 20px #0002;z-index:99999;transition:transform .35s ease}
#toast.show{transform:translateX(-50%) translateY(0)}
a{color:#6d28d9}
.info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:13px;margin:10px 0}
@media(max-width:520px){
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
main{margin:18px auto}
.panel{padding:16px}
}
</style>
</head>

<body>

<div id="toast"></div>

<header>
<div class="logo">MS STORE</div>
<a href="index.html">← SHOPPING</a>
</header>

<main>

<section class="panel">
<h2>🛒 Your Order</h2>

<div id="cartList">Cart লোড হচ্ছে...</div>

<div class="row"><span>Subtotal</span><b id="subtotal">৳0</b></div>
<div class="row"><span>Delivery Charge</span><b id="delivery">৳0</b></div>
<div class="row total"><span>Total</span><b id="total">৳0</b></div>

<p id="cartMessage" class="msg"></p>

<a href="index.html" style="display:inline-block;margin-top:12px">← আরও পণ্য কিনুন</a>

<button id="proceedBtn" class="orange" disabled>
PROCEED TO CHECKOUT
</button>

<p id="gateMessage" class="msg"></p>
</section>

<section class="panel hidden" id="deliveryPanel">

<h2>📦 Delivery Information</h2>

<p id="verifiedStatus" class="msg cart-success">
Email Verified ✓
</p>

<div class="grid">

<input id="customerName" placeholder="আপনার নাম *">

<input id="phone" type="tel" placeholder="মোবাইল নম্বর *">

<input id="orderEmail" class="full" type="email" placeholder="অর্ডার Confirmation-এর Email *">

<select id="division" class="full">
<option value="">বিভাগ নির্বাচন করুন *</option>
<option value="Dhaka">ঢাকা</option>
<option value="Chattogram">চট্টগ্রাম</option>
<option value="Rajshahi">রাজশাহী</option>
<option value="Khulna">খুলনা</option>
<option value="Barishal">বরিশাল</option>
<option value="Sylhet">সিলেট</option>
<option value="Rangpur">রংপুর</option>
<option value="Mymensingh">ময়মনসিংহ</option>
</select>

<input id="district" placeholder="জেলা *">
<input id="upazila" placeholder="উপজেলা / থানা *">

<textarea id="address" class="full" placeholder="বিস্তারিত ঠিকানা *"></textarea>

<select id="paymentMethod" class="full">
<option value="Cash on Delivery">Cash on Delivery</option>
<option value="bKash Manual">bKash Personal</option>
<option value="Nagad Manual">Nagad Personal</option>
</select>

<div id="paymentInfo" class="full msg"></div>

<input id="senderNumber" class="full hidden" placeholder="যে নম্বর থেকে টাকা পাঠিয়েছেন">
<input id="trxId" class="full hidden" placeholder="Transaction ID">

</div>

<button id="placeOrder" class="orange">
CONFIRM ORDER
</button>

<p id="orderMsg" class="msg"></p>

<button id="checkoutLogout" class="red">
Logout
</button>

</section>

</main>

<script type="module">

import {
initializeApp
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';

import {
initializeAuth,
onAuthStateChanged,
signOut,
browserLocalPersistence,
reload
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
setDoc,
runTransaction,
serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';


/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
authDomain:"ms-store-admin-26416.firebaseapp.com",
projectId:"ms-store-admin-26416",
storageBucket:"ms-store-admin-26416.firebasestorage.app",
messagingSenderId:"968008425065",
appId:"1:968008425065:web:1e0904dcab96d4d003ccf8"
};

const app=initializeApp(firebaseConfig);

const auth=initializeAuth(app,{
persistence:browserLocalPersistence
});

const db=getFirestore(app);

const EMAILJS_SERVICE_ID='service_9ck9kob';
const EMAILJS_TEMPLATE_ID='template_rbe08jk';
const EMAILJS_PUBLIC_KEY='4gQjk5EWAQ7tk-st';

const $=id=>document.getElementById(id);

const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));


/* STATE */

let cart={};
let products=[];
let currentUser=null;

let payment={
bkashNumber:'',
nagadNumber:''
};

let globalVariantEnabled=true;
let toastTimer=null;
let cartLoaded=false;
let orderSubmitting=false;
let authReady=false;
let profileReady=false;
let checkoutRequested=false;

/* BUY NOW MODE */
const buyNowMode=localStorage.getItem('msBuyNowMode')==='1';


/* TOAST */

function showToast(message){

$('toast').textContent=message;
$('toast').classList.add('show');

clearTimeout(toastTimer);

toastTimer=setTimeout(()=>{
$('toast').classList.remove('show');
},3500);

}


/* ERROR */

function authError(e){

const m=e.code||e.message;

const errors={

'auth/email-already-in-use':'এই Email দিয়ে আগে অ্যাকাউন্ট খোলা হয়েছে।',
'auth/invalid-email':'Email ঠিক নয়।',
'auth/weak-password':'Password কমপক্ষে ৬ অক্ষরের হতে হবে।',
'auth/invalid-credential':'Email অথবা Password ভুল।',
'auth/user-not-found':'এই Email দিয়ে অ্যাকাউন্ট পাওয়া যায়নি।',
'auth/too-many-requests':'কিছুক্ষণ পরে আবার চেষ্টা করুন।',
'auth/network-request-failed':'Internet Connection পরীক্ষা করুন।',
'permission-denied':'Firestore Rules অনুমতি দিচ্ছে না।',
'unavailable':'Internet Connection পরীক্ষা করুন।'

};

return errors[m]||e.message||String(e);

}


/* CART */

function readCart(){

try{

const saved=localStorage.getItem('msCart');

if(!saved){
cart={};
return;
}

const parsed=JSON.parse(saved);

if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)){
cart={};
return;
}

cart=parsed;

}catch(e){

console.error(e);
cart={};

}

}

readCart();


function getEntries(){

return Object.entries(cart).filter(([key,item])=>{

if(item&&typeof item==='object'){

const id=item.productId||key.split('__')[0];

return Boolean(id)&&Number.isInteger(Number(item.quantity))&&Number(item.quantity)>0;

}

return Number.isInteger(Number(item))&&Number(item)>0;

});

}


function isVariantProduct(p){

return globalVariantEnabled&&
p.hasVariants===true&&
Array.isArray(p.variants)&&
p.variants.some(v=>v.active!==false);

}


/* DELIVERY */

function getDelivery(){

if(!getEntries().length)return 0;

return $('division').value==='Dhaka'?60:80;

}


/* RENDER CART */

function renderCart(){

const entries=getEntries();

let subtotal=0;
let invalid=false;
let html='';

if(!entries.length){

$('cartList').innerHTML='আপনার Cart খালি। <a href="index.html">পণ্য বেছে নিন</a>';

}else{

for(const [key,item] of entries){

const objectItem=item&&typeof item==='object';

const id=objectItem?(item.productId||key.split('__')[0]):key;

const p=products.find(x=>x.id===id);

if(!p){

invalid=true;

html+=`<div class="cart-product"><strong>পণ্য পাওয়া যাচ্ছে না</strong><div class="cart-error">এই পণ্যটি Store থেকে সরানো হয়েছে।</div></div>`;

continue;

}

const qty=objectItem?Number(item.quantity):Number(item);

const variantId=objectItem?item.variantId||'':'';

const variant=(p.variants||[]).find(v=>v.id===variantId);

const variantProduct=isVariantProduct(p);

let stock=variant
?Math.max(0,Number(variant.stock)||0)
:Math.max(0,Number(p.stock)||0);

let price=objectItem
?Number(item.price??variant?.price??p.price)
:Number(p.price)||0;

let label=objectItem&&item.variantLabel
?item.variantLabel+': '+(item.variantValue||'')
:'';

let error='';

if(p.active===false)error='এই পণ্যটি বর্তমানে বিক্রির জন্য নেই।';

if(variantProduct&&!variant)error='Variant নির্বাচন সঠিক নয়। পণ্যটি আবার Cart-এ যোগ করুন।';

if(variantId&&!globalVariantEnabled)error='Variant System বর্তমানে বন্ধ।';

if(qty>stock)error='স্টকে পর্যাপ্ত পণ্য নেই।';

if(!Number.isFinite(price)||price<0)error='পণ্যের দাম সঠিক নয়।';

if(error)invalid=true;

subtotal+=Math.max(0,price)*qty;

html+=`
<div class="cart-product">
<strong>${esc(p.name||'Product')}</strong>
${label?`<div class="variant-info">${esc(label)}</div>`:''}
<div class="variant-info">${money(price)} × ${qty} = ${money(price*qty)}</div>
${error?`<div class="cart-error">${esc(error)}</div>`:''}
</div>`;

}

$('cartList').innerHTML=html;

}

const delivery=getDelivery();

$('subtotal').textContent=money(subtotal);
$('delivery').textContent=money(delivery);
$('total').textContent=money(subtotal+delivery);

if(invalid){

$('cartMessage').textContent='Cart-এ পণ্য বা Stock সমস্যা রয়েছে। অর্ডারের আগে Cart ঠিক করুন।';
$('cartMessage').className='msg cart-error';

}else{

$('cartMessage').textContent=entries.length?'আপনার Cart সফলভাবে লোড হয়েছে।':'';
$('cartMessage').className='msg cart-success';

}

return{
entries,
subtotal,
delivery,
total:subtotal+delivery,
invalid
};

}


/* LOAD DATA */

async function loadData(){

$('cartList').textContent='পণ্যের তথ্য লোড হচ্ছে...';

try{

const ps=await getDocs(collection(db,'storeProducts'));

products=ps.docs.map(d=>({
id:d.id,
...d.data()
}));

cartLoaded=true;

}catch(e){

console.error(e);

cartLoaded=false;

$('cartList').innerHTML='<span class="cart-error">পণ্যের তথ্য লোড হয়নি: '+esc(authError(e))+'</span>';

$('cartMessage').textContent=e.code||e.message;

return;

}

renderCart();

try{

const pm=await getDoc(doc(db,'storeSettings','paymentMethods'));

if(pm.exists()){
payment={...payment,...pm.data()};
}

}catch(e){

console.error('Payment settings:',e);

}

try{

const vs=await getDoc(doc(db,'storeSettings','variantSettings'));

globalVariantEnabled=vs.exists()?vs.data().enabled!==false:true;

}catch(e){

console.error('Variant settings:',e);

globalVariantEnabled=true;

}

renderCart();
renderPayment();

}


/* PAYMENT */

function renderPayment(){

const method=$('paymentMethod').value;

if(method==='Cash on Delivery'){

$('paymentInfo').textContent='Cash on Delivery';

$('senderNumber').classList.add('hidden');
$('trxId').classList.add('hidden');

$('senderNumber').required=false;
$('trxId').required=false;

$('senderNumber').value='';
$('trxId').value='';

return;

}

const isBkash=method==='bKash Manual';

const number=isBkash?payment.bkashNumber:payment.nagadNumber;

const label=isBkash?'bKash Personal':'Nagad Personal';

$('paymentInfo').innerHTML=`
<div class="payment-notice">
<strong>${label}: ${esc(number||'Admin Panel থেকে নম্বর সেট করা হয়নি')}</strong>
<p>এই নম্বরে শুধুমাত্র Send Money গ্রহণ করা হয়। দয়া করে Payment বা Cash Out করবেন না।</p>
</div>`;

$('senderNumber').classList.remove('hidden');
$('trxId').classList.remove('hidden');

$('senderNumber').required=true;
$('trxId').required=true;

}

$('paymentMethod').onchange=renderPayment;
$('division').onchange=renderCart;


/* CUSTOMER PROFILE */

async function ensureProfile(user){

const profileRef=doc(db,'customerProfiles',user.uid);

const snap=await getDoc(profileRef);

if(!snap.exists()){

throw Error('Customer Profile পাওয়া যায়নি। My Account থেকে আবার Login করুন।');

}

const profile=snap.data();

if(profile.banned===true){

await signOut(auth);

throw Error('এই অ্যাকাউন্টটি বন্ধ করা হয়েছে।');

}

return profile;

}


/* CHECKOUT GATE */

function hideDelivery(){

$('deliveryPanel').classList.add('hidden');

}

function showDelivery(profile){

$('deliveryPanel').classList.remove('hidden');

$('verifiedStatus').textContent='Email Verified ✓ | '+currentUser.email;

$('customerName').value=profile.name||'';
$('phone').value=profile.phone||'';
$('orderEmail').value=currentUser.email||'';

$('deliveryPanel').scrollIntoView({
behavior:'smooth',
block:'start'
});

}


async function redirectToAccount(reason){

hideDelivery();

const returnUrl='my-account.html?return=checkout';

$('gateMessage').textContent=reason;

showToast(reason);

setTimeout(()=>{

window.location.href=returnUrl;

},700);

}


async function checkCheckoutAccess(){

if(!checkoutRequested)return;

if(!authReady){

$('gateMessage').textContent='Login যাচাই হচ্ছে। একটু অপেক্ষা করুন।';

return;

}

if(!currentUser){

await redirectToAccount('অর্ডার করতে প্রথমে Login করুন।');

return;

}

try{

await reload(currentUser);

currentUser=auth.currentUser;

if(!currentUser){

await redirectToAccount('প্রথমে Login করুন।');

return;

}

if(!currentUser.emailVerified){

await redirectToAccount('আপনার Email Verify করা হয়নি। My Account থেকে Email Verify করুন।');

return;

}

const profile=await ensureProfile(currentUser);

profileReady=true;

$('gateMessage').textContent='';

showDelivery(profile);

}catch(e){

console.error('CHECKOUT ACCESS:',e);

$('gateMessage').textContent=authError(e);

}

}


/* PROCEED */

$('proceedBtn').onclick=async()=>{

if(!cartLoaded){

showToast('Cart লোড হচ্ছে। একটু অপেক্ষা করুন।');

return;

}

const data=renderCart();

if(!data.entries.length){

showToast('আপনার Cart খালি।');

return;

}

if(data.invalid){

showToast('Cart-এর সমস্যা আগে ঠিক করুন।');

return;

}

checkoutRequested=true;

await checkCheckoutAccess();

};


/* VALIDATION */

function validEmail(email){

return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

}

function normalizeTrxId(value){

return String(value||'').trim().toUpperCase();

}


/* PLACE ORDER */

$('placeOrder').onclick=async()=>{

if(orderSubmitting)return;

$('orderMsg').textContent='';

if(!currentUser){

$('orderMsg').textContent='Login প্রয়োজন।';

await redirectToAccount('প্রথমে Login করুন।');

return;

}

try{

await reload(currentUser);

currentUser=auth.currentUser;

}catch(e){

$('orderMsg').textContent=authError(e);

return;

}

if(!currentUser||!currentUser.emailVerified){

$('orderMsg').textContent='Email Verification প্রয়োজন।';

await redirectToAccount('Email Verify করে আবার Checkout করুন।');

return;

}

if(!profileReady){

try{

await ensureProfile(currentUser);

profileReady=true;

}catch(e){

$('orderMsg').textContent=authError(e);

return;

}

}


/* CART */

if(!cartLoaded){

$('orderMsg').textContent='পণ্যের তথ্য লোড হয়নি। Reload করে আবার চেষ্টা করুন।';

return;

}

const cartData=renderCart();

if(!cartData.entries.length){

$('orderMsg').textContent='আপনার Cart খালি।';

return;

}

if(cartData.invalid){

$('orderMsg').textContent='Cart-এ Stock বা Variant সমস্যা রয়েছে।';

return;

}


/* CUSTOMER INFO */

const name=$('customerName').value.trim();

const phone=$('phone').value.trim();

const orderEmail=$('orderEmail').value.trim().toLowerCase();

const division=$('division').value;

const district=$('district').value.trim();

const upazila=$('upazila').value.trim();

const address=$('address').value.trim();

const method=$('paymentMethod').value;

const senderNumber=$('senderNumber').value.trim();

const trxId=method==='Cash on Delivery'
?''
:normalizeTrxId($('trxId').value);

if(!name||!phone||!division||!district||!upazila||!address){

$('orderMsg').textContent='সব ঠিকানার তথ্য পূরণ করুন।';

return;

}

if(!validEmail(orderEmail)){

$('orderMsg').textContent='সঠিক Email Address লিখুন।';

return;

}

if(method!=='Cash on Delivery'&&(!senderNumber||!trxId)){

$('orderMsg').textContent='Sender Number ও Transaction ID দিন।';

return;

}

if(method!=='Cash on Delivery'&&!/^[A-Z0-9-]{4,40}$/.test(trxId)){

$('orderMsg').textContent='Transaction ID সঠিকভাবে লিখুন।';

return;

}

if(method!=='Cash on Delivery'){

$('trxId').value=trxId;

}


/* START */

orderSubmitting=true;

$('placeOrder').disabled=true;

$('placeOrder').textContent='PROCESSING...';

try{

const counterRef=doc(db,'counters','orderSequence');

const variantSettingsRef=doc(db,'storeSettings','variantSettings');

const trxRef=method==='Cash on Delivery'
?null
:doc(db,'usedTransactionIds',trxId);


/* FIRESTORE TRANSACTION */

const result=await runTransaction(db,async tx=>{

/* ALL READS FIRST */

const counterSnap=await tx.get(counterRef);

const variantSettingsSnap=await tx.get(variantSettingsRef);

if(trxRef){

const trxSnap=await tx.get(trxRef);

if(trxSnap.exists()){

throw Error('DUPLICATE_TRX: এই Transaction ID আগে ব্যবহার করা হয়েছে।');

}

}

const transactionVariantEnabled=variantSettingsSnap.exists()
?variantSettingsSnap.data().enabled!==false
:true;

const freshProducts=[];


/* LATEST PRODUCTS */

for(const [key,item] of cartData.entries){

const objectItem=item&&typeof item==='object';

const productId=objectItem?(item.productId||key.split('__')[0]):key;

const quantity=objectItem?Number(item.quantity):Number(item);

const productRef=doc(db,'storeProducts',productId);

const productSnap=await tx.get(productRef);

if(!productSnap.exists())throw Error('একটি পণ্য আর পাওয়া যাচ্ছে না।');

const data=productSnap.data();

if(data.active===false)throw Error((data.name||'পণ্য')+' বর্তমানে বিক্রির জন্য নেই।');

if(!Number.isInteger(quantity)||quantity<=0)throw Error('পণ্যের পরিমাণ সঠিক নয়।');

const variantId=objectItem?item.variantId||'':'';

const variantLabel=objectItem?item.variantLabel||'':'';

const variantValue=objectItem?item.variantValue||'':'';

const variantMode=transactionVariantEnabled&&
data.hasVariants===true&&
Array.isArray(data.variants)&&
data.variants.some(v=>v.active!==false);

let variant=null;

let stock=Math.max(0,Number(data.stock)||0);

let price=Number(data.price)||0;

if(variantMode){

if(!variantId)throw Error((data.name||'পণ্য')+' এর Variant নির্বাচন করুন।');

variant=(data.variants||[]).find(v=>v.id===variantId);

if(!variant||variant.active===false)throw Error('নির্বাচিত Variant আর পাওয়া যাচ্ছে না।');

stock=Math.max(0,Number(variant.stock)||0);

price=Number(variant.price??data.price)||0;

}else if(variantId){

throw Error('Variant System বর্তমানে বন্ধ।');

}

if(stock<quantity)throw Error((data.name||'পণ্য')+' এর পর্যাপ্ত Stock নেই।');

freshProducts.push({

id:productId,
ref:productRef,
name:data.name||'Product',
quantity,
price,
stock,
variantId,
variantLabel,
variantValue,
variantMode,
variants:data.variants||[],
productImage:Array.isArray(data.images)&&data.images.length
?data.images[0]
:data.imageUrl||''

});

}


/* ORDER LINES */

const lines=freshProducts.map(p=>({

productId:p.id,
productName:p.name,
price:p.price,
quantity:p.quantity,
productImage:p.productImage,

...(p.variantMode?{

variantId:p.variantId,
variantLabel:p.variantLabel,
variantValue:p.variantValue

}:{ })

}));

const sub=lines.reduce((s,p)=>s+p.price*p.quantity,0);

const del=division==='Dhaka'?60:80;

const total=sub+del;


/* ORDER NUMBER */

const num=(counterSnap.exists()?Number(counterSnap.data().lastNumber)||0:0)+1;

const newOrderId='MS-'+String(num).padStart(4,'0');

const orderRef=doc(db,'orders',newOrderId);

const trackingRef=doc(db,'orderTracking',newOrderId);


/* GROUP PRODUCTS */

const productGroups=new Map();

freshProducts.forEach(p=>{

if(!productGroups.has(p.id)){

productGroups.set(p.id,{

ref:p.ref,
variantMode:p.variantMode,
variants:p.variants,
normalStock:p.stock,
normalQuantity:0,
variantQuantities:new Map()

});

}

const group=productGroups.get(p.id);

if(p.variantMode){

const oldQty=group.variantQuantities.get(p.variantId)||0;

group.variantQuantities.set(p.variantId,oldQty+p.quantity);

}else{

group.normalQuantity+=p.quantity;

}

});


/* VALIDATE STOCK */

for(const group of productGroups.values()){

if(group.variantMode){

for(const [variantId,quantity] of group.variantQuantities){

const v=group.variants.find(x=>x.id===variantId);

if(!v||v.active===false)throw Error('একটি Variant আর পাওয়া যাচ্ছে না।');

if(Number(v.stock||0)<quantity)throw Error('একটি Variant-এর পর্যাপ্ত Stock নেই।');

}

}else if(group.normalQuantity>group.normalStock){

throw Error('একটি পণ্যের পর্যাপ্ত Stock নেই।');

}

}


/* STOCK CHANGES */

const stockChanges={};

freshProducts.forEach(p=>{

stockChanges[p.id]=(stockChanges[p.id]||0)+p.quantity;

});


/* ALL WRITES */

tx.set(counterRef,{lastNumber:num});


if(trxRef){

tx.set(trxRef,{

trxId,
paymentMethod:method,
orderId:newOrderId,
uid:currentUser.uid,
createdAt:serverTimestamp()

});

}


/* ORDER */

tx.set(orderRef,{

uid:currentUser.uid,
customerName:name,
phone,
email:orderEmail,
accountEmail:currentUser.email,
address,
division,
district,
upazila,

productName:lines.map(p=>
p.productName+
(p.variantValue?' ('+p.variantValue+')':'')+
' x'+p.quantity
).join(', '),

products:lines,

productIds:[...new Set(lines.map(p=>p.productId))],

stockChanges,
quantity:lines.reduce((s,p)=>s+p.quantity,0),
subtotal:sub,
deliveryCharge:del,
totalPrice:total,
paymentMethod:method,
senderNumber,
trxId,
paymentStatus:method==='Cash on Delivery'?'Pending':'Unverified',
orderId:newOrderId,
status:'Pending',
createdAt:serverTimestamp()

});


/* TRACKING */

tx.set(trackingRef,{

orderId:newOrderId,
status:'Pending',
createdAt:serverTimestamp()

});


/* STOCK UPDATE */

for(const [productId,group] of productGroups){

if(group.variantMode){

const updatedVariants=group.variants.map(v=>{

const quantity=group.variantQuantities.get(v.id)||0;

if(quantity<=0)return v;

return{

...v,
stock:Math.max(0,Number(v.stock||0)-quantity)

};

});

const totalStock=updatedVariants
.filter(v=>v.active!==false)
.reduce((s,v)=>s+(Number(v.stock)||0),0);

tx.update(group.ref,{

variants:updatedVariants,
stock:totalStock,
lastStockOrderId:newOrderId

});

}else{

tx.update(group.ref,{

stock:group.normalStock-group.normalQuantity,
lastStockOrderId:newOrderId

});

}

}

return{

orderId:newOrderId,
lines,
subtotal:sub,
delivery:del,
total

};

});


/* SUCCESS */

cart={};

try{

localStorage.removeItem('msCart');
localStorage.removeItem('msBuyNowMode');
localStorage.removeItem('msCartBackup');

}catch(e){

console.error('Cart Clear Error:',e);

}

renderCart();


/* EMAIL CONFIRMATION */

let emailSent=false;

try{

const emailjs=await import('https://cdn.jsdelivr.net/npm/@emailjs/browser@4/+esm');

await emailjs.default.send(

EMAILJS_SERVICE_ID,
EMAILJS_TEMPLATE_ID,

{

to_email:orderEmail,
customer_name:name,
order_id:result.orderId,

product_name:result.lines.map(p=>
p.productName+
(p.variantValue?' ('+p.variantLabel+': '+p.variantValue+')':'')+
' x'+p.quantity
).join(', '),

subtotal:money(result.subtotal),
delivery_charge:money(result.delivery),
total_price:money(result.total),
order_status:'Pending',
tracking_link:'https://mylifeshorts070-tech.github.io/ms-store/my-account.html'

},

EMAILJS_PUBLIC_KEY

);

emailSent=true;

}catch(emailError){

console.error('EmailJS Error:',emailError);

}


/* SUCCESS MESSAGE */

$('orderMsg').innerHTML=`

<b style="color:green">অর্ডার সফল হয়েছে!</b>
<br>
Order ID: <b>${esc(result.orderId)}</b>
<br>
পণ্যের Stock স্বয়ংক্রিয়ভাবে আপডেট হয়েছে।
<br>
${emailSent?'Confirmation Email পাঠানো হয়েছে।':'অর্ডার হয়েছে, তবে Confirmation Email পাঠানো যায়নি।'}
<br><br>
<a href="my-account.html">আমার অর্ডার দেখুন</a>

`;

showToast(emailSent
?'অর্ডার সফল হয়েছে! Confirmation Email পাঠানো হয়েছে।'
:'অর্ডার সফল হয়েছে! Email পাঠানো যায়নি।');


}catch(e){

console.error('ORDER ERROR:',e);

let message=e.message||String(e);

if(message.includes('DUPLICATE_TRX')){

message='এই Transaction ID আগে ব্যবহার করা হয়েছে। নতুন Transaction ID দিন।';

}

$('orderMsg').innerHTML=`

<b style="color:red">অর্ডার জমা হয়নি!</b>
<br>
Error Code: ${esc(e.code||'Unknown')}
<br>
Error Message: ${esc(message)}
<br><br>
${esc(authError(e))}

`;

showToast('অর্ডার জমা হয়নি। Error Message দেখুন।');

}finally{

orderSubmitting=false;

$('placeOrder').disabled=false;

$('placeOrder').textContent='CONFIRM ORDER';

}

};


/* LOGOUT */

$('checkoutLogout').onclick=async()=>{

try{

await signOut(auth);

currentUser=null;
profileReady=false;
checkoutRequested=false;

hideDelivery();

$('gateMessage').textContent='আপনি Logout করেছেন। আবার Checkout করতে Login করুন।';

showToast('আপনি Logout করেছেন।');

}catch(e){

$('orderMsg').textContent=authError(e);

}

};


/* AUTH STATE */

const authPromise=new Promise(resolve=>{

let firstAuthCheck=true;

onAuthStateChanged(auth,async user=>{

currentUser=user;

if(firstAuthCheck){

firstAuthCheck=false;
authReady=true;
resolve();

}

if(!user){

profileReady=false;
hideDelivery();

if(checkoutRequested){

await redirectToAccount('অর্ডার করতে Login করুন।');

}

return;

}

if(checkoutRequested){

await checkCheckoutAccess();

}

});

});


/* START */

await authPromise;

await loadData();

if(!cartLoaded){

$('proceedBtn').disabled=true;

}else{

$('proceedBtn').disabled=false;

}

if(currentUser){

try{

await reload(currentUser);

currentUser=auth.currentUser;

if(currentUser&&currentUser.emailVerified){

const profile=await ensureProfile(currentUser);

profileReady=true;

$('gateMessage').textContent='আপনি Login ও Email Verify করেছেন। Checkout করতে Proceed চাপুন।';

}else{

$('gateMessage').textContent='Checkout করতে Email Verification প্রয়োজন। Proceed চাপলে My Account-এ যেতে পারবেন।';

}

}catch(e){

console.error('INITIAL AUTH:',e);

$('gateMessage').textContent=authError(e);

}

}else{

$('gateMessage').textContent='অর্ডার করতে Proceed চাপুন। Login না থাকলে My Account-এ নিয়ে যাওয়া হবে।';

}


/* AUTO CHECKOUT: BUY NOW */

if(buyNowMode){

const data=renderCart();

if(!cartLoaded){

$('gateMessage').textContent='পণ্যের তথ্য লোড হয়নি। Internet Connection পরীক্ষা করুন।';

}else if(!data.entries.length){

$('gateMessage').textContent='Buy Now-এর পণ্য পাওয়া যায়নি। আবার Product নির্বাচন করুন।';

showToast('Cart খালি।');

}else if(data.invalid){

$('gateMessage').textContent='পণ্যের Stock বা Variant সমস্যা রয়েছে।';

showToast('পণ্যের তথ্য পরীক্ষা করুন।');

}else{

checkoutRequested=true;

await checkCheckoutAccess();

}

}

</script>

</body>
</html>
