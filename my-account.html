
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS STORE | My Account</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;font-family:Arial,sans-serif;color:#202536}
header{background:#111827;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px}
header a{color:#f59e0b;text-decoration:none;font-weight:bold}
main{max-width:850px;margin:25px auto;padding:0 14px}
.panel{background:white;border-radius:13px;padding:19px;margin-bottom:16px}
h2{margin-top:0;font-size:21px}
button{border:0;border-radius:8px;padding:11px 15px;background:#111827;color:white;font-weight:bold;cursor:pointer}
button.red{background:#dc2626}
input{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:8px;margin:5px 0 10px;font-size:15px}
.order{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:15px;margin:12px 0;line-height:1.7;overflow-wrap:anywhere}
.order textarea{width:100%;min-height:75px;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
.status{display:inline-block;background:#e2e8f0;padding:4px 9px;border-radius:15px;font-size:12px;font-weight:bold}
.msg{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
 <b style="font-size:22px">MS STORE</b>
 <a href="index.html">← SHOPPING</a>
</header>
<main>
 <section class="panel">
  <h2>My Account / আমার অ্যাকাউন্ট</h2>
  <div id="profile">অ্যাকাউন্ট লোড হচ্ছে...</div>
  <button id="logout" class="red hidden">Logout</button>
  <p id="authMsg" class="msg"></p>
 </section>
 <section class="panel">
  <h2>My Orders / আমার অর্ডার</h2>
  <div id="orders">অর্ডার লোড হচ্ছে...</div>
 </section>
</main>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import{getFirestore,doc,getDoc,collection,getDocs,query,where,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

const firebaseConfig={
 apiKey:"AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
 authDomain:"ms-store-admin-26416.firebaseapp.com",
 projectId:"ms-store-admin-26416",
 storageBucket:"ms-store-admin-26416.firebasestorage.app",
 messagingSenderId:"968008425065",
 appId:"1:968008425065:web:1e0904dcab96d4d003ccf8"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentUser=null;

$('logout').onclick=async()=>{
 await signOut(auth);
 location.href='index.html';
};

function dateText(timestamp){
 if(!timestamp?.toDate)return 'তারিখ পাওয়া যায়নি';
 return timestamp.toDate().toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'});
}

async function loadAccount(user){
 currentUser=user;
 try{
  const p=await getDoc(doc(db,'customerProfiles',user.uid));
  if(p.exists()&&p.data().banned){
   $('profile').textContent='এই অ্যাকাউন্টটি বন্ধ করা হয়েছে।';
   await signOut(auth);return;
  }
  const data=p.exists()?p.data():{};
  $('profile').innerHTML=`
   <p><b>নাম:</b> ${esc(data.name||'—')}</p>
   <p><b>Email:</b> ${esc(user.email)}</p>
   <p><b>মোবাইল:</b> ${esc(data.phone||'—')}</p>
   <p><b>Account Created:</b> ${dateText(data.createdAt)}</p>`;
  $('logout').classList.remove('hidden');
  await loadOrders();
 }catch(e){
  $('profile').textContent='অ্যাকাউন্ট লোড হয়নি: '+e.message;
 }
}

async function loadOrders(){
 if(!currentUser)return;
 $('orders').textContent='অর্ডার লোড হচ্ছে...';
 try{
  const s=await getDocs(query(collection(db,'orders'),where('uid','==',currentUser.uid)));
  const list=s.docs.map(d=>({id:d.id,...d.data()}))
   .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if(!list.length){$('orders').textContent='এখনো কোনো অর্ডার করেননি।';return}
  $('orders').innerHTML=list.map(o=>`
   <div class="order">
    <b>Order ID:</b> ${esc(o.orderId||o.id)}<br>
    <b>তারিখ:</b> ${dateText(o.createdAt)}<br>
    <b>পণ্য:</b> ${esc(o.productName||'—')}<br>
    <b>মোট পরিমাণ:</b> ${Number(o.quantity||0)}<br>
    <b>Subtotal:</b> ${money(o.subtotal)}<br>
    <b>Delivery:</b> ${money(o.deliveryCharge)}<br>
    <b>Total:</b> ${money(o.totalPrice)}<br>
    <b>Payment:</b> ${esc(o.paymentMethod||'—')}<br>
    <b>Payment Status:</b> ${esc(o.paymentStatus||'—')}<br>
    <b>Order Status:</b> <span class="status">${esc(o.status||'Pending')}</span>
    ${o.status==='Pending'?`
     <textarea id="reason-${esc(o.id)}" placeholder="অর্ডার বাতিলের কারণ লিখুন"></textarea>
     <button class="red" data-cancel="${esc(o.id)}">CONFIRM CANCELLATION</button>`:''}
    ${o.status==='Cancelled'&&o.cancellationReason?`<p><b>বাতিলের কারণ:</b> ${esc(o.cancellationReason)}</p>`:''}
   </div>`).join('');
  $('orders').querySelectorAll('[data-cancel]').forEach(b=>{
   b.onclick=()=>cancelOrder(b.dataset.cancel);
  });
 }catch(e){
  $('orders').textContent='অর্ডার লোড হয়নি: '+e.message;
 }
}

async function cancelOrder(id){
 const reason=$('reason-'+id)?.value.trim();
 if(!reason){alert('অর্ডার বাতিলের কারণ লিখুন।');return}
 if(!confirm('আপনি কি এই Pending অর্ডারটি বাতিল করতে চান?'))return;
 try{
  const ref=doc(db,'orders',id),s=await getDoc(ref);
  if(!s.exists()||s.data().uid!==currentUser.uid||s.data().status!=='Pending'){
   throw Error('শুধু নিজের Pending অর্ডার বাতিল করা যাবে।');
  }
  await updateDoc(ref,{
   status:'Cancelled',
   cancellationReason:reason,
   cancelledAt:serverTimestamp()
  });
  await updateDoc(doc(db,'orderTracking',s.data().orderId||id),{
   status:'Cancelled'
  });
  alert('আপনার অর্ডার বাতিল হয়েছে।');
  await loadOrders();
 }catch(e){
  alert('অর্ডার বাতিল করা যায়নি: '+e.message);
 }
}

onAuthStateChanged(auth,user=>{
 if(!user){
  currentUser=null;
  $('profile').innerHTML='আপনি Login করেননি।<br><br><a href="checkout.html">Checkout পেজে গিয়ে Login করুন</a>';
  $('orders').textContent='অর্ডার দেখতে Login করুন।';
  $('logout').classList.add('hidden');
  return;
 }
 loadAccount(user);
});
</script>
</body>
</html>
