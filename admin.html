<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS STORE | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5fa;color:#182033;font-family:Arial,sans-serif}
header{background:#172554;color:#fff;padding:20px}
header h2{margin:0 0 5px;font-size:22px}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;padding:18px;border-radius:14px;margin:16px 0;box-shadow:0 2px 12px #00000010}
h3{margin:0 0 14px}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #d7dce5;border-radius:8px;font-size:15px}
button{background:#1d4ed8;color:#fff;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55}
.danger{background:#dc2626}.green{background:#15803d}
.hidden{display:none}
.item{border-bottom:1px solid #e5e7eb;padding:14px 0}
.productline{display:flex;gap:12px;align-items:center}
.productline img{width:76px;height:76px;object-fit:cover;border-radius:9px;background:#eee}
.productinfo{flex:1;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:9px}
.actions button{flex:1}
small{color:#64748b}
#preview{display:none;width:110px;height:110px;object-fit:cover;border-radius:9px;margin-top:8px}
label{display:block;margin-top:10px;font-weight:bold;font-size:14px}
.order{background:#f8fafc;padding:12px;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h2>MS STORE | Admin Panel</h2>
<small style="color:#dbeafe">Store Management Dashboard</small>
</header>
<main>
<section id="login" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="loginMsg"></p>
</section>
<section id="dashboard" class="hidden">
<div class="card">
<h3>Dashboard</h3>
<p>Total Products: <b id="productCount">0</b></p>
<p>Total Orders: <b id="orderCount">0</b></p>
<button id="logoutBtn" class="danger">Logout</button>
</div>
<div class="card">
<h3>Add New Product</h3>
<input id="pname" placeholder="Product Name">
<input id="price" type="number" min="0" placeholder="Price (৳)">
<input id="stock" type="number" min="0" placeholder="Stock">
<input id="category" placeholder="Category">
<label for="imageFile">Product Photo — Gallery থেকে ছবি বাছাই করুন</label>
<input id="imageFile" type="file" accept="image/*">
<img id="preview" alt="Image preview">
<button id="addBtn">Add Product</button>
<p id="productMsg"></p>
<small>ছবি ছোট করে সংরক্ষণ করা হবে।</small>
</div>
<div class="card">
<h3>All Products</h3>
<div id="products">Loading...</div>
</div>
<div class="card">
<h3>Customer Orders</h3>
<div id="orders">Loading...</div>
</div>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
  authDomain: "ms-store-admin-26416.firebaseapp.com",
  projectId: "ms-store-admin-26416",
  storageBucket: "ms-store-admin-26416.firebasestorage.app",
  messagingSenderId: "968008425065",
  appId: "1:968008425065:web:1e0904dcab96d4d003ccf8"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let selectedImage="";

function setMessage(message){
$("productMsg").textContent=message;
}

async function compressImage(file){
if(!file)return "";
if(!file.type.startsWith("image/"))throw Error("একটি ছবি নির্বাচন করুন");
const bitmap=await createImageBitmap(file);
const maxSide=480;
const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
const canvas=document.createElement("canvas");
canvas.width=Math.max(1,Math.round(bitmap.width*scale));
canvas.height=Math.max(1,Math.round(bitmap.height*scale));
canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
bitmap.close();
const data=canvas.toDataURL("image/jpeg",0.45);
if(data.length>600000)throw Error("ছবিটি অনেক বড়। আরও ছোট ছবি নির্বাচন করুন।");
return data;
}

$("imageFile").addEventListener("change",async()=>{
const file=$("imageFile").files[0];
selectedImage="";
$("preview").style.display="none";
if(!file)return;
try{
selectedImage=await compressImage(file);
$("preview").src=selectedImage;
$("preview").style.display="block";
}catch(error){
setMessage(error.message);
$("imageFile").value="";
}
});

$("loginBtn").addEventListener("click",async()=>{
$("loginBtn").disabled=true;
$("loginMsg").textContent="Logging in...";
try{
await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
$("loginMsg").textContent="";
}catch(error){
$("loginMsg").textContent="Login failed: "+error.message;
}finally{
$("loginBtn").disabled=false;
}
});

$("logoutBtn").addEventListener("click",()=>signOut(auth));

onAuthStateChanged(auth,async user=>{
$("login").classList.toggle("hidden",!!user);
$("dashboard").classList.toggle("hidden",!user);
if(user)await loadData();
});

$("addBtn").addEventListener("click",async()=>{
const name=$("pname").value.trim();
const price=Number($("price").value);
const stock=Number($("stock").value);
if(!name||$("price").value===""||$("stock").value===""||
!Number.isFinite(price)||!Number.isFinite(stock)||price<0||stock<0){
setMessage("পণ্যের নাম, সঠিক দাম ও স্টক লিখুন।");
return;
}
$("addBtn").disabled=true;
try{
setMessage("পণ্য যোগ হচ্ছে...");
await addDoc(collection(db,"storeProducts"),{
name,price,stock,
category:$("category").value.trim()||"General",
imageUrl:selectedImage,
active:true
});
["pname","price","stock","category","imageFile"].forEach(id=>$(id).value="");
$("preview").style.display="none";
selectedImage="";
setMessage("পণ্য সফলভাবে যোগ হয়েছে।");
await loadData();
}catch(error){
setMessage("পণ্য যোগ হয়নি: "+error.message);
}finally{
$("addBtn").disabled=false;
}
});

async function loadData(){
try{
const productSnap=await getDocs(collection(db,"storeProducts"));
$("productCount").textContent=productSnap.size;
$("products").innerHTML="";
productSnap.forEach(productDoc=>{
const p=productDoc.data();
const item=document.createElement("div");
item.className="item";
const line=document.createElement("div");
line.className="productline";
if(p.imageUrl){
const img=document.createElement("img");
img.src=p.imageUrl;
img.alt=p.name||"Product";
line.append(img);
}
const info=document.createElement("div");
info.className="productinfo";
const title=document.createElement("b");
title.textContent=p.name||"Unnamed product";
const details=document.createElement("div");
details.textContent="৳"+(p.price??0)+" | Stock: "+(p.stock??0)+" | "+(p.category||"General");
info.append(title,details);
line.append(info);
item.append(line);

const actions=document.createElement("div");
actions.className="actions";
const edit=document.createElement("button");
edit.className="green";
edit.textContent="Edit";
edit.onclick=async()=>{
const name=prompt("Product name:",p.name||"");
if(name===null)return;
const priceText=prompt("Price:",String(p.price??0));
if(priceText===null)return;
const stockText=prompt("Stock:",String(p.stock??0));
if(stockText===null)return;
const price=Number(priceText),stock=Number(stockText);
if(!name.trim()||priceText.trim()===""||stockText.trim()===""||
!Number.isFinite(price)||!Number.isFinite(stock)||price<0||stock<0){
alert("সঠিক তথ্য দিন।");return;
}
try{
await updateDoc(doc(db,"storeProducts",productDoc.id),{name:name.trim(),price,stock});
await loadData();
}catch(error){alert("Edit হয়নি: "+error.message);}
};
const remove=document.createElement("button");
remove.className="danger";
remove.textContent="Delete";
remove.onclick=async()=>{
if(!confirm("এই পণ্যটি মুছে ফেলবেন?"))return;
try{
await deleteDoc(doc(db,"storeProducts",productDoc.id));
await loadData();
}catch(error){alert("Delete হয়নি: "+error.message);}
};
actions.append(edit,remove);
item.append(actions);
$("products").append(item);
});
if(productSnap.empty)$("products").textContent="এখনো কোনো পণ্য যোগ করা হয়নি।";

const orderSnap=await getDocs(collection(db,"orders"));
$("orderCount").textContent=orderSnap.size;
$("orders").innerHTML="";
orderSnap.forEach(orderDoc=>{
const o=orderDoc.data();
const box=document.createElement("div");
box.className="order";
const details=document.createElement("p");
details.textContent=(o.customerName||"Customer")+" | "+(o.phone||"")+" | "+(o.productName||"")+" | Total ৳"+(o.totalPrice??0)+" | Payment: "+(o.paymentMethod||"")+" | TrxID: "+(o.trxId||"");
const address=document.createElement("small");
address.textContent="Address: "+(o.address||"");
const status=document.createElement("select");
["Pending","Confirmed","Shipped","Delivered","Cancelled"].forEach(value=>{
const option=document.createElement("option");
option.value=value;option.textContent=value;status.append(option);
});
status.value=o.status||"Pending";
const save=document.createElement("button");
save.className="green";
save.textContent="Update Order Status";
save.onclick=async()=>{
try{
await updateDoc(doc(db,"orders",orderDoc.id),{status:status.value});
alert("Order status updated.");
}catch(error){alert("Update হয়নি: "+error.message);}
};
box.append(details,address,status,save);
$("orders").append(box);
});
if(orderSnap.empty)$("orders").textContent="এখনো কোনো অর্ডার নেই।";
}catch(error){
$("products").textContent="ডেটা লোড হয়নি: "+error.message;
$("orders").textContent="Firestore Rules বা Firebase সংযোগ পরীক্ষা করুন।";
}
}
</script>
</body>
</html>
