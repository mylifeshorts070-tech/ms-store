
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS STORE Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#1e293b}
header{background:#111827;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h2{margin:0;color:#f59e0b}
main{max-width:950px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0000000b}
h3{margin-top:0}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
textarea{min-height:70px}
button{padding:11px 15px;border:0;border-radius:7px;background:#111827;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.orange{background:#f59e0b;color:#111827}
.red{background:#dc2626}
.green{background:#15803d}
.hidden{display:none!important}
.msg{font-size:14px;line-height:1.5;margin:8px 0}
.product,.order{border:1px solid #e2e8f0;border-radius:9px;padding:13px;margin:10px 0;overflow-wrap:anywhere}
.product img{width:75px;height:75px;object-fit:cover;border-radius:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.order select{margin-top:8px}
.small{font-size:12px;color:#64748b}
#logout{background:#dc2626}
@media(max-width:500px){.row{grid-template-columns:1fr}main{padding:9px}}
</style>
</head>
<body>

<header>
<h2>MS STORE ADMIN</h2>
<button id="logout" class="hidden">Logout</button>
</header>

<main>
<section id="loginSection" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
<p id="loginMsg" class="msg"></p>
</section>

<div id="adminArea" class="hidden">

<section class="card">
<h3 id="formTitle">Add New Product</h3>
<input id="productName" placeholder="Product Name">
<div class="row">
<input id="productPrice" type="number" min="0" placeholder="Price">
<input id="productStock" type="number" min="0" placeholder="Stock">
</div>
<input id="productCategory" placeholder="Category">
<input id="productImage" type="url" placeholder="Image URL (optional)">
<p class="small">ছবির সরাসরি URL দিতে হবে। Firebase Storage আপলোড এখানে ব্যবহার করা হচ্ছে না।</p>
<div class="actions">
<button id="saveProduct" class="orange">SAVE PRODUCT</button>
<button id="cancelEdit" class="hidden">CANCEL</button>
</div>
<p id="productMsg" class="msg"></p>
</section>

<section class="card">
<h3>All Products</h3>
<div id="productList">Loading...</div>
</section>

<section class="card">
<h3>Customer Orders</h3>
<button id="refreshOrders" class="orange">REFRESH ORDERS</button>
<div id="orderList">Loading...</div>
</section>

</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
 getFirestore,collection,addDoc,getDocs,doc,updateDoc,
 deleteDoc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
  authDomain: "ms-store-admin-26416.firebaseapp.com",
  projectId: "ms-store-admin-26416",
  storageBucket: "ms-store-admin-26416.firebasestorage.app",
  messagingSenderId: "968008425065",
  appId: "1:968008425065:web:1e0904dcab96d4d003ccf8"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let editingId=null;

function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="Logging in...";
 $("loginBtn").disabled=true;
 try{
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
  $("loginMsg").textContent="";
 }catch(e){
  $("loginMsg").textContent="Login failed: "+e.message;
 }finally{
  $("loginBtn").disabled=false;
 }
};

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 if(user){
  $("loginSection").classList.add("hidden");
  $("adminArea").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  loadProducts();
  loadOrders();
 }else{
  $("loginSection").classList.remove("hidden");
  $("adminArea").classList.add("hidden");
  $("logout").classList.add("hidden");
 }
});

function clearForm(){
 editingId=null;
 $("productName").value="";
 $("productPrice").value="";
 $("productStock").value="";
 $("productCategory").value="";
 $("productImage").value="";
 $("formTitle").textContent="Add New Product";
 $("saveProduct").textContent="SAVE PRODUCT";
 $("cancelEdit").classList.add("hidden");
}

$("cancelEdit").onclick=clearForm;

$("saveProduct").onclick=async()=>{
 const name=$("productName").value.trim();
 const price=Number($("productPrice").value);
 const stock=Number($("productStock").value);
 const category=$("productCategory").value.trim()||"General";
 const imageUrl=$("productImage").value.trim();

 if(!name||$("productPrice").value===""||$("productStock").value===""||
    !Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0){
  $("productMsg").textContent="সঠিক Product Name, Price ও Stock দিন।";
  return;
 }

 $("saveProduct").disabled=true;
 $("productMsg").textContent="Saving...";

 const data={name,price,stock,category,active:true,imageUrl};

 try{
  if(editingId){
   await updateDoc(doc(db,"storeProducts",editingId),data);
   $("productMsg").textContent="Product updated successfully.";
  }else{
   await addDoc(collection(db,"storeProducts"),{
    ...data,createdAt:serverTimestamp()
   });
   $("productMsg").textContent="Product added successfully.";
  }
  clearForm();
  await loadProducts();
 }catch(e){
  console.error(e);
  $("productMsg").textContent="Save failed: "+e.message;
 }finally{
  $("saveProduct").disabled=false;
 }
};

async function loadProducts(){
 $("productList").textContent="Loading...";
 try{
  const snap=await getDocs(collection(db,"storeProducts"));
  if(snap.empty){
   $("productList").textContent="No products found.";
   return;
  }

  $("productList").innerHTML=snap.docs.map(d=>{
   const p=d.data();
   return `<div class="product">
    <div class="row">
     <div>
      <b>${safe(p.name)}</b><br>
      Price: ৳${safe(p.price)}<br>
      Stock: ${safe(p.stock)}<br>
      Category: ${safe(p.category)}
     </div>
     <div>${p.imageUrl?`<img src="${safe(p.imageUrl)}" alt="Product">`:""}</div>
    </div>
    <div class="actions">
     <button class="orange" data-edit="${safe(d.id)}">EDIT</button>
     <button class="red" data-delete="${safe(d.id)}">DELETE</button>
    </div>
   </div>`;
  }).join("");

  $("productList").querySelectorAll("[data-edit]").forEach(b=>{
   b.onclick=()=>{
    const d=snap.docs.find(x=>x.id===b.dataset.edit);
    const p=d.data();
    editingId=d.id;
    $("productName").value=p.name||"";
    $("productPrice").value=p.price??"";
    $("productStock").value=p.stock??"";
    $("productCategory").value=p.category||"";
    $("productImage").value=p.imageUrl||"";
    $("formTitle").textContent="Edit Product";
    $("saveProduct").textContent="UPDATE PRODUCT";
    $("cancelEdit").classList.remove("hidden");
    window.scrollTo({top:0,behavior:"smooth"});
   };
  });

  $("productList").querySelectorAll("[data-delete]").forEach(b=>{
   b.onclick=async()=>{
    if(!confirm("এই Product Delete করতে চাও?"))return;
    try{
     await deleteDoc(doc(db,"storeProducts",b.dataset.delete));
     await loadProducts();
    }catch(e){alert("Delete failed: "+e.message);}
   };
  });
 }catch(e){
  console.error(e);
  $("productList").textContent="Products load failed: "+e.message;
 }
}

const statuses=["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled"];

async function loadOrders(){
 $("orderList").textContent="Loading...";
 try{
  const snap=await getDocs(collection(db,"orders"));
  if(snap.empty){
   $("orderList").textContent="No orders yet.";
   return;
  }

  const orders=snap.docs.map(d=>({id:d.id,...d.data()}));
  orders.sort((a,b)=>{
   const ta=a.createdAt?.toMillis?.()||0;
   const tb=b.createdAt?.toMillis?.()||0;
   return tb-ta;
  });

  $("orderList").innerHTML=orders.map(o=>{
   const id=o.orderId||o.id;
   const items=Array.isArray(o.products)
    ?o.products.map(p=>`${safe(p.productName)} × ${safe(p.quantity)}`).join("<br>")
    :safe(o.productName||"");
   const status=o.status||"Pending";

   return `<div class="order">
    <b>Order ID: ${safe(id)}</b><br>
    Customer: ${safe(o.customerName)}<br>
    Phone: ${safe(o.phone)}<br>
    Address: ${safe(o.address)}<br>
    Products: ${items}<br>
    Total: <b>৳${safe(o.totalPrice)}</b><br>
    Payment: ${safe(o.paymentMethod)}<br>
    Payment status: ${safe(o.paymentStatus||"Pending")}<br>
    Current status: <b>${safe(status)}</b>

    <label>Update Order Status</label>
    <select data-status="${safe(o.id)}">
     ${statuses.map(s=>`<option value="${s}" ${s===status?"selected":""}>${s}</option>`).join("")}
    </select>
    <button class="green" data-update="${safe(o.id)}" data-orderid="${safe(id)}">UPDATE STATUS</button>
   </div>`;
  }).join("");

  $("orderList").querySelectorAll("[data-update]").forEach(b=>{
   b.onclick=async()=>{
    const orderDocId=b.dataset.update;
    const orderId=b.dataset.orderid;
    const select=$("orderList").querySelector(`[data-status="${CSS.escape(orderDocId)}"]`);
    const newStatus=select.value;
    b.disabled=true;
    try{
     await updateDoc(doc(db,"orders",orderDocId),{status:newStatus});
     await setDoc(doc(db,"orderTracking",orderId),{
      orderId,status:newStatus,updatedAt:serverTimestamp()
     },{merge:true});
     alert("Order status updated.");
     await loadOrders();
    }catch(e){
     console.error(e);
     alert("Status update failed: "+e.message);
    }finally{
     b.disabled=false;
    }
   };
  });
 }catch(e){
  console.error(e);
  $("orderList").textContent="Orders load failed: "+e.message;
 }
}

$("refreshOrders").onclick=loadOrders;
</script>
</body>
</html>
