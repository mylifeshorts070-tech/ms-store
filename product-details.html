
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6816a8">
<title>Product Details | MS STORE</title>
<style>
:root{
 --purple:#6816a8;
 --purple2:#8b35cb;
 --orange:#ff8b22;
 --bg:#f7f4fb;
 --dark:#25172e;
 --muted:#777080;
 --border:#e9e2ef;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--dark);
 font-family:Arial,"Noto Sans Bengali",sans-serif;
}
button{font:inherit;cursor:pointer}
header{
 background:linear-gradient(120deg,#511080,#7924b5);
 color:white;
 padding:14px 16px;
 position:sticky;
 top:0;
 z-index:20;
}
.header-inner{
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}
.logo{font-size:22px;font-weight:900;color:white;text-decoration:none}
.logo span{color:#ffae53}
.header-btn{
 color:white;
 background:#ffffff20;
 border:1px solid #ffffff55;
 border-radius:20px;
 padding:9px 13px;
 font-size:13px;
}
main{max-width:1100px;margin:auto;padding:15px}
.breadcrumb{font-size:12px;color:var(--muted);margin:8px 0 15px}
.product-layout{
 display:grid;
 grid-template-columns:1fr;
 gap:18px;
}
.gallery,.details{
 background:white;
 border:1px solid var(--border);
 border-radius:15px;
 padding:13px;
}
.main-image{
 width:100%;
 aspect-ratio:1/1;
 background:#f1ebf6;
 border-radius:11px;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
}
.main-image img{width:100%;height:100%;object-fit:contain}
.thumbnails{
 display:flex;
 gap:9px;
 overflow-x:auto;
 margin-top:10px;
}
.thumb{
 flex:0 0 65px;
 height:65px;
 border:2px solid transparent;
 border-radius:8px;
 overflow:hidden;
 background:#f1ebf6;
 padding:0;
}
.thumb.active{border-color:var(--purple)}
.thumb img{width:100%;height:100%;object-fit:cover}
.product-title{font-size:22px;line-height:1.4;margin:3px 0 12px}
.price-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.price{font-size:25px;color:var(--purple);font-weight:900}
.old-price{color:#999;text-decoration:line-through;font-size:14px}
.discount{
 background:#fff0df;color:#a14d00;
 padding:5px 8px;border-radius:6px;font-size:12px;font-weight:bold;
}
.stock{font-size:13px;margin:12px 0;color:#159957}
.description{
 font-size:14px;
 line-height:1.8;
 color:#5f5665;
 white-space:pre-wrap;
}
.divider{border:0;border-top:1px solid var(--border);margin:17px 0}
.qty-row{display:flex;align-items:center;gap:12px;margin:16px 0}
.qty-controls{
 display:flex;align-items:center;
 border:1px solid var(--border);border-radius:9px;overflow:hidden;
}
.qty-controls button{
 width:38px;height:37px;border:0;background:#f5f0f8;
 color:var(--purple);font-size:20px;
}
.qty-controls span{min-width:38px;text-align:center;font-weight:bold}
.actions{display:flex;gap:9px;margin-top:15px}
.action-btn{
 flex:1;border:0;border-radius:9px;padding:13px 8px;
 font-size:13px;font-weight:bold;
}
.add{background:var(--purple);color:white}
.buy{background:var(--orange);color:white}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.extra-info{
 background:#fff8ef;border:1px solid #ffe1bd;
 border-radius:10px;padding:12px;
 font-size:12px;line-height:1.7;margin-top:16px;
}
.section{
 background:white;border:1px solid var(--border);
 border-radius:14px;padding:15px;margin-top:18px;
}
.section h2{font-size:18px;margin:0 0 12px}
.review{
 border-bottom:1px solid var(--border);
 padding:12px 0;font-size:13px;
}
.review:last-child{border:0}
.stars{color:#ed9b17;letter-spacing:2px}
.review-form input,.review-form textarea{
 width:100%;padding:11px;border:1px solid var(--border);
 border-radius:8px;margin:7px 0;font:inherit;
}
.review-form textarea{min-height:85px;resize:vertical}
.review-form button{
 background:var(--purple);color:white;border:0;
 border-radius:8px;padding:11px 15px;font-weight:bold;
}
.message{font-size:12px;margin-top:10px;line-height:1.6}
footer{
 background:#241331;color:#ddd;padding:22px 15px;
 text-align:center;margin-top:25px;font-size:12px;
}
.loading,.error{
 background:white;padding:35px;text-align:center;
 border-radius:12px;color:var(--muted);
}
@media(min-width:700px){
 main{padding:22px}
 .product-layout{grid-template-columns:1fr 1fr;align-items:start}
 .product-title{font-size:27px}
 .gallery,.details{padding:18px}
}
</style>
</head>
<body>

<header>
 <div class="header-inner">
  <a class="logo" href="index.html">MS <span>STORE</span></a>
  <div>
   <button class="header-btn" onclick="location.href='index.html'">Home</button>
   <button class="header-btn" onclick="location.href='index.html'">Cart</button>
  </div>
 </div>
</header>

<main>
 <div class="breadcrumb">
  <a href="index.html">Home</a> / Product Details
 </div>

 <div id="productArea" class="loading">পণ্যের তথ্য লোড হচ্ছে...</div>

 <section class="section" id="reviewSection" style="display:none">
  <h2>⭐ Customer Reviews</h2>
  <div id="reviewList">Reviews লোড হচ্ছে...</div>
  <hr class="divider">
  <h3 style="font-size:15px">Write a Review</h3>
  <div class="review-form">
   <label for="reviewRating">Rating</label>
   <select id="reviewRating" style="padding:10px;border:1px solid #e9e2ef;border-radius:8px;width:100%;margin-top:7px">
    <option value="5">★★★★★ - Excellent</option>
    <option value="4">★★★★ - Very Good</option>
    <option value="3">★★★ - Good</option>
    <option value="2">★★ - Fair</option>
    <option value="1">★ - Poor</option>
   </select>
   <textarea id="reviewText" placeholder="আপনার অভিজ্ঞতা লিখুন..."></textarea>
   <button onclick="submitReview()">Submit Review</button>
   <div id="reviewMessage" class="message"></div>
  </div>
 </section>
</main>

<footer>
 MS STORE — Online Shopping Bangladesh
 <br><br>
 <a href="https://m.me/61596287770024" target="_blank" rel="noopener">Messenger Support</a>
</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
 getFirestore,doc,getDoc,collection,getDocs,
 query,where,limit,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import {
 getAuth,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyAXWNG3D4FYzJYOFAgksTmzYFYBEsL9-gk",
 authDomain:"ms-store-admin-26416.firebaseapp.com",
 projectId:"ms-store-admin-26416",
 storageBucket:"ms-store-admin-26416.firebasestorage.app",
 messagingSenderId:"968008425065",
 appId:"1:968008425065:web:1e0904dcab96d4d003ccf8"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const params=new URLSearchParams(location.search);
const productId=params.get("id")||params.get("productId")||params.get("pid");

let product=null;
let currentUser=null;
let quantity=1;
let selectedImage=0;
let galleryImages=[];
const money=n=>"৳"+Number(n||0).toLocaleString("en-US");
const nameOf=p=>p.name||p.title||p.productName||"Product";
const priceOf=p=>Number(p.salePrice??p.discountPrice??p.price??p.regularPrice??0)||0;
const oldPriceOf=p=>Number(p.originalPrice??p.oldPrice??p.regularPrice??0)||0;
const imageOf=p=>p.imageUrl||p.image||p.photoURL||p.thumbnail||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

onAuthStateChanged(auth,user=>currentUser=user);

function getImages(p){
 let images=[];
 if(Array.isArray(p.images))images=p.images;
 if(Array.isArray(p.gallery))images=images.concat(p.gallery);
 const main=imageOf(p);
 if(main)images.unshift(main);
 return [...new Set(images.filter(x=>typeof x==="string"&&x.trim()))];
}

async function loadProduct(){
 const area=document.getElementById("productArea");
 if(!productId){
  area.innerHTML='<div class="error">Product ID পাওয়া যায়নি। <br><br><a href="index.html">Home-এ ফিরে যান</a></div>';
  return;
 }
 try{
  const snap=await getDoc(doc(db,"storeProducts",productId));
  if(!snap.exists()){
   area.innerHTML='<div class="error">এই পণ্যটি পাওয়া যায়নি। <br><br><a href="index.html">Home-এ ফিরে যান</a></div>';
   return;
  }
  product={id:snap.id,...snap.data()};
  if(product.active===false||product.isActive===false||product.hidden===true){
   area.innerHTML='<div class="error">এই পণ্যটি বর্তমানে পাওয়া যাচ্ছে না।</div>';
   return;
  }
  galleryImages=getImages(product);
  renderProduct();
  document.title=nameOf(product)+" | MS STORE";
  document.getElementById("reviewSection").style.display="block";
  loadReviews();
 }catch(e){
  console.error(e);
  area.innerHTML='<div class="error">পণ্যের তথ্য লোড করা যায়নি। Internet এবং Firebase Rules পরীক্ষা করুন।</div>';
 }
}

function renderProduct(){
 const p=product;
 const price=priceOf(p);
 const old=oldPriceOf(p);
 const stock=p.stock;
 const out=stock!==undefined&&Number(stock)<=0;
 const mainImage=galleryImages[selectedImage]||"";
 const description=p.description||p.details||p.productDescription||"এই পণ্য সম্পর্কে বিস্তারিত তথ্য শীঘ্রই যুক্ত করা হবে।";
 const discount=old>price?Math.round((old-price)/old*100):0;

 document.getElementById("productArea").innerHTML=`
 <div class="product-layout">
  <div class="gallery">
   <div class="main-image">
    ${mainImage?`<img id="mainProductImage" src="${esc(mainImage)}" alt="${esc(nameOf(p))}">`:"<span style='font-size:65px'>📦</span>"}
   </div>
   <div class="thumbnails">
    ${galleryImages.map((img,i)=>`
     <button class="thumb ${i===selectedImage?"active":""}" onclick="selectImage(${i})">
      <img src="${esc(img)}" alt="Product image ${i+1}">
     </button>`).join("")}
   </div>
  </div>

  <div class="details">
   <h1 class="product-title">${esc(nameOf(p))}</h1>
   <div class="price-line">
    <span class="price">${money(price)}</span>
    ${old>price?`<span class="old-price">${money(old)}</span><span class="discount">${discount}% OFF</span>`:""}
   </div>
   <div class="stock">${out?"Out of stock":stock!==undefined?"Available — Stock: "+Number(stock):"Available"}</div>
   <hr class="divider">
   <h3 style="font-size:15px">Product Description</h3>
   <div class="description">${esc(description)}</div>
   <hr class="divider">
   <div class="qty-row">
    <strong style="font-size:13px">Quantity:</strong>
    <div class="qty-controls">
     <button onclick="changeQuantity(-1)">−</button>
     <span id="quantityValue">1</span>
     <button onclick="changeQuantity(1)">+</button>
    </div>
   </div>
   <div class="actions">
    <button class="action-btn add" ${out?"disabled":""} onclick="addToCart()">Add to Cart</button>
    <button class="action-btn buy" ${out?"disabled":""} onclick="buyNow()">Buy Now</button>
   </div>
   <div class="extra-info">
    🚚 Delivery available across Bangladesh.<br>
    💬 Need help? <a href="https://m.me/61596287770024" target="_blank" rel="noopener" style="color:#6816a8;font-weight:bold">Contact MS STORE</a>
   </div>
  </div>
 </div>`;
}

window.selectImage=i=>{
 selectedImage=i;
 const image=document.getElementById("mainProductImage");
 if(image)image.src=galleryImages[i];
 document.querySelectorAll(".thumb").forEach((el,index)=>el.classList.toggle("active",index===i));
};

window.changeQuantity=delta=>{
 const next=quantity+delta;
 if(next<1)return;
 if(product?.stock!==undefined&&next>Number(product.stock)){
  alert("পর্যাপ্ত Stock নেই।");
  return;
 }
 quantity=next;
 document.getElementById("quantityValue").textContent=quantity;
};

function readCart(){
 try{
  const saved=JSON.parse(localStorage.getItem("msCart")||"{}");
  if(Array.isArray(saved)){
   const result={};
   saved.forEach(x=>{
    if(x&&(x.productId||x.id))result[x.productId||x.id]=Number(x.quantity)||1;
   });
   return result;
  }
  return saved&&typeof saved==="object"?saved:{};
 }catch(e){return {};}
}
function saveCart(cart){
 localStorage.setItem("msCart",JSON.stringify(cart));
}

window.addToCart=()=>{
 if(!product)return;
 const cart=readCart();
 cart[product.id]=(Number(cart[product.id])||0)+quantity;
 saveCart(cart);
 alert("পণ্যটি Cart-এ যোগ হয়েছে!");
};

window.buyNow=()=>{
 if(!product)return;
 const cart=readCart();
 cart[product.id]=(Number(cart[product.id])||0)+quantity;
 saveCart(cart);
 location.href="checkout.html";
};

async function loadReviews(){
 const box=document.getElementById("reviewList");
 try{
  const snap=await getDocs(collection(db,"storeProducts",productId,"reviews"));
  if(snap.empty){
   box.innerHTML='<p style="font-size:13px;color:#777">এখনো কোনো Review নেই।</p>';
   return;
  }
  box.innerHTML=snap.docs.map(d=>{
   const r=d.data();
   const rating=Math.max(1,Math.min(5,Number(r.rating)||5));
   return `<div class="review">
    <div class="stars">${"★".repeat(rating)}${"☆".repeat(5-rating)}</div>
    <strong>${esc(r.name||"Customer")}</strong>
    <p>${esc(r.comment||r.text||"")}</p>
   </div>`;
  }).join("");
 }catch(e){
  console.error(e);
  box.innerHTML='<p style="font-size:13px">Review লোড করা যায়নি।</p>';
 }
}

window.submitReview=async()=>{
 const msg=document.getElementById("reviewMessage");
 const comment=document.getElementById("reviewText").value.trim();
 const rating=Number(document.getElementById("reviewRating").value);
 if(!currentUser){
  msg.textContent="Review দিতে Login করুন।";
  return;
 }
 if(!currentUser.emailVerified){
  msg.textContent="Review দিতে Email verify করতে হবে।";
  return;
 }
 if(!comment){
  msg.textContent="আপনার Review লিখুন।";
  return;
 }
 try{
  const profile=await getDoc(doc(db,"customerProfiles",currentUser.uid));
  if(!profile.exists()||profile.data().banned!==false){
   msg.textContent="Customer profile পাওয়া যায়নি অথবা Account সক্রিয় নয়।";
   return;
  }

  const orderQuery=query(
   collection(db,"orders"),
   where("uid","==",currentUser.uid),
   where("status","==","Delivered"),
   limit(30)
  );
  const orderSnap=await getDocs(orderQuery);
  const hasPurchased=orderSnap.docs.some(d=>{
   const data=d.data();
   const items=data.items||data.products||[];
   return Array.isArray(items)&&items.some(item=>
    String(item.productId||item.id||"")===productId
   );
  });
  if(!hasPurchased){
   msg.textContent="শুধু Delivered Order-এর ক্রেতারা Review দিতে পারবেন।";
   return;
  }

  const reviewRef=doc(db,"storeProducts",productId,"reviews",currentUser.uid);
  await setDoc(reviewRef,{
   uid:currentUser.uid,
   name:currentUser.displayName||profile.data().name||"Customer",
   rating,
   comment,
   createdAt:serverTimestamp()
  });
  msg.textContent="আপনার Review জমা হয়েছে। ধন্যবাদ!";
  document.getElementById("reviewText").value="";
  await loadReviews();
 }catch(e){
  console.error(e);
  msg.textContent="Review জমা দেওয়া যায়নি: "+e.message;
 }
};

loadProduct();
</script>
</body>
</html>
